<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#73578c"><meta name="description" content="A thoughtful, private space to track your cycle, notice patterns, and find evidence-linked guidance."><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>Cyclekind — your cycle, understood</title><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="stylesheet" href="./styles.css"><script type="module" src="./app.js"></script></head>
<body><a class="skip" href="#main">Skip to content</a><div id="app"></div><div id="toast" role="status" aria-live="polite"></div>
<dialog id="period-dialog"><form id="period-form"><div class="modal-top"><span class="eyebrow">YOUR CYCLE</span><button class="icon-button" type="button" data-close="period-dialog" aria-label="Close dialog">×</button></div><h2 id="period-title">Log your period</h2><input type="hidden" name="id"><label>First day<input type="date" name="start" required></label><label class="check-row"><input type="checkbox" name="ongoing"> Still on my period</label><label id="end-label">Last day<input type="date" name="end" required></label><p class="field-note">Spotting? Add it as a symptom.</p><p id="period-error" class="error" role="alert"></p><div class="modal-actions"><button type="button" class="button ghost" data-close="period-dialog">Cancel</button><button type="submit" class="button primary">Save period</button></div></form></dialog>
<dialog id="symptom-dialog"><form id="symptom-form"><div class="modal-top"><span class="eyebrow">DAILY CHECK-IN</span><button class="icon-button" type="button" data-close="symptom-dialog" aria-label="Close dialog">×</button></div><h2>How do you feel?</h2><label>Date<input type="date" name="date" required></label><fieldset><legend>Symptoms</legend><div class="symptom-choices" id="symptom-choices"></div></fieldset><label>Discomfort<select name="severity"><option value="0">None</option><option value="1">Mild — manageable</option><option value="2">Moderate — affects my day</option><option value="3">Severe — stops usual activities</option></select></label><label>Note <span class="optional">(optional)</span><textarea name="note" maxlength="1000" rows="3" placeholder="What helped? What felt different?"></textarea></label><p id="symptom-error" class="error" role="alert"></p><div class="modal-actions"><button type="button" class="button ghost" data-close="symptom-dialog">Cancel</button><button class="button primary" type="submit">Save check-in</button></div></form></dialog>
<dialog id="confirm-dialog"><div class="modal-top"><span class="eyebrow">PLEASE CONFIRM</span><button class="icon-button" data-close="confirm-dialog" aria-label="Close dialog">×</button></div><h2 id="confirm-title"></h2><p id="confirm-text" class="muted"></p><div class="modal-actions"><button class="button ghost" data-close="confirm-dialog">Cancel</button><button class="button primary" id="confirm-yes">Confirm</button></div></dialog>
<input type="file" id="import-file" accept="application/json,.json" hidden>
<noscript>This app needs JavaScript to keep records on your device and calculate estimates.</noscript></body></html>
